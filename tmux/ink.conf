# Paper: matches desktop/kde/paper/Paper.colorscheme. No plugins or special font glyphs required.
set -g status on
set -g status-position bottom
set -g status-interval 15
set -g status-style 'bg=#f3f3f3,fg=#626262'
set -g status-justify left
set -g status-left-length 28
set -g status-right-length 55
set -g status-left '#[bg=#202020,fg=#fafafa,bold] #S #[default] '
set -g status-right '#[fg=#202020]#{?client_prefix, PREFIX ,}#{?pane_in_mode, COPY ,}#[fg=#808080]#{?window_zoomed_flag, ZOOM | ,}#[fg=#626262]%a %d %b #[fg=#202020]%H:%M '

setw -g window-status-separator ' '
setw -g window-status-format ' #I:#W#{?window_bell_flag, !,} '
setw -g window-status-style 'bg=#f3f3f3,fg=#626262'
setw -g window-status-current-format ' #I:#W#{?window_zoomed_flag, +,} '
setw -g window-status-current-style 'bg=#202020,fg=#ffffff,bold'
setw -g window-status-activity-style 'fg=#202020,bg=#f3f3f3'
setw -g window-status-bell-style 'fg=#202020,bg=#f3f3f3,bold'

set -g pane-border-style 'fg=#202020'
set -g pane-active-border-style 'fg=#626262'
set -g pane-border-lines single
set -g pane-border-status off
set -g display-panes-colour '#808080'
set -g display-panes-active-colour '#202020'
set -g message-style 'bg=#202020,fg=#fafafa'
set -g message-command-style 'bg=#202020,fg=#fafafa'
setw -g mode-style 'bg=#202020,fg=#ffffff'
set -g clock-mode-colour '#202020'
set -g clock-mode-style 24
set -g menu-style 'bg=#f3f3f3,fg=#202020'
set -g menu-selected-style 'bg=#202020,fg=#ffffff,bold'
set -g menu-border-style 'fg=#808080'
set -g popup-style 'bg=#fafafa,fg=#202020'
set -g popup-border-style 'fg=#808080'

# Advertise RGB support for common terminal types without changing TERM.
set -as terminal-features ',xterm*:RGB,alacritty*:RGB,foot*:RGB,kitty*:RGB'
