unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix

set -g status-position bottom
set -g status-style 'bg=#232627,fg=#a0a0a0'
set -g status-bg '#232627'
set -g status-fg '#a0a0a0'
setw -g window-style 'bg=#232627'
setw -g window-active-style 'bg=#232627'
set -g status-left ''
set -g status-right '#[fg=#a0a0a0,bg=#232627] %d/%m #[fg=#dedede,bg=#232627,bold] %H:%M:%S '
set -g status-interval 1
set -g status-right-length 50
set -g status-left-length 20
set -g mouse on

setw -g window-status-current-style 'bg=#232627,fg=#dedede,bold'
setw -g window-status-current-format ' #I#[fg=#909090]:#[fg=#eeeeee]#W#[fg=#b0b0b0]#F '
setw -g window-status-style 'bg=#232627,fg=#909090'
setw -g window-status-format ' #I#[fg=#606060]:#[fg=#a0a0a0]#W#[fg=#808080]#F '
setw -g window-status-activity-style 'fg=#dedede'
setw -g window-status-bell-style 'fg=#eeeeee,bold'

set -g pane-border-style 'fg=#404040'
set -g pane-active-border-style 'fg=#808080'
set -g message-style 'bg=#232627,fg=#dedede'
set -g message-command-style 'bg=#232627,fg=#dedede'
setw -g mode-style 'bg=#232627,fg=#eeeeee'

set-option -g history-limit 5000
set -g extended-keys on
